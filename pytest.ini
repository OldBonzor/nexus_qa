[pytest]
# Minimum required version of pytest
minversion = 7.0

# Directory containing pytest tests
testpaths = tests

# Custom markers registration to prevent warnings during execution
markers =
    ui: mark a test as a user interface (UI) test requiring browser automation

# Naming patterns for test files
python_files = test_*.py

# Naming patterns for test classes
python_classes = Test*

# Naming patterns for test functions/methods
python_functions = test_*

# Base arguments for execution (verbose output and short traceback format)
addopts = -v --tb=short

# Directories to ignore during test discovery
norecursedirs = .venv .git config

# Live CLI Logging Configuration for CI/CD & Docker Streams
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
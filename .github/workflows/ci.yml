name: QA Automation Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  # Allow manual trigger with test suite selection
  workflow_dispatch:
    inputs:
      test_marker:
        description: 'Select test marker to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - api
          - ui
          - regression

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code to the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Create .env file dynamically from GitHub Secrets
      - name: Create .env file from GitHub Secrets
        run: |
          echo "ENV=${{ secrets.ENV }}" >> .env
          echo "BASE_UI_URL=${{ secrets.BASE_UI_URL }}" >> .env
          echo "BASE_API_URL=${{ secrets.BASE_API_URL }}" >> .env
          echo "TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL }}" >> .env
          echo "TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }}" >> .env
          echo "PAGE_TIMEOUT=${{ secrets.PAGE_TIMEOUT }}" >> .env
          echo "HEADLESS_MODE=${{ secrets.HEADLESS_MODE }}" >> .env

      # Step 3: Set up Docker Buildx and build container image with layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export Docker image to local runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true # Load built image into local Docker daemon so docker compose can use it
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 4: # Run API smoke tests automatically on push or manually via workflow_dispatch
      # UI tests are excluded from CI Smoke suite due to timeout issues caused by GitHub Actions free tier resource limitations 
      # and potential DDoS protection on the target server triggered by requests from dynamic GitHub runner IP pools.
      
      - name: Run Smoke Tests
        if: ${{ github.event.inputs.test_marker == 'smoke' || github.event_name == 'push' }}
        run: docker compose run --rm nexus_qa_runner pytest -m "api and smoke"

      - name: Run API Tests
        if: github.event.inputs.test_marker == 'api'
        run: docker compose run --rm nexus_qa_runner pytest -m "api"

      - name: Run UI Tests
        if: github.event.inputs.test_marker == 'ui'
        run: docker compose run --rm nexus_qa_runner pytest -m "ui"

      - name: Run Regression Suite
        if: github.event.inputs.test_marker == 'regression'
        run: docker compose run --rm nexus_qa_runner pytest

      # Step 5: Upload Allure results as a workflow artifact
      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always() # Ensures artifacts are uploaded even if tests fail
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30